name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to deploy without rebuilding (e.g. v1.2.3, 1.2, or sha-abc1234). Defaults to latest.'
        required: false
        default: 'latest'

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate (lint, test, build)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: ci-secret-placeholder-32-chars-minimum-length
      BETTER_AUTH_SECRET: ci-secret-placeholder-32-chars-minimum-length
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      DATABASE_URL: postgres://shayga:shayga_dev@localhost:5432/shayga
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shayga
          POSTGRES_PASSWORD: shayga_dev
          POSTGRES_DB: shayga
          PGDATA: /var/lib/postgresql/pgdata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shayga -d shayga"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        volumes:
          - /var/lib/postgresql
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.1.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & Component tests
        run: pnpm test

      - name: Apply database migrations
        run: |
          pnpm exec payload migrate
          pnpm exec better-auth migrate --config src/lib/auth.ts -y

      - name: Build Next.js & Payload
        run: pnpm build

  release:
    name: Semantic Release
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.detect.outputs.released }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_SECRET }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.1.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Highest existing tag
        id: before
        run: |
          BEFORE_TAG=$(git ls-remote --tags origin 'v*' | cut -f2 | sed 's#refs/tags/##' | sort -V | tail -1 || true)
          echo "tag=$BEFORE_TAG" >> "$GITHUB_OUTPUT"
          echo "Found existing tag: $BEFORE_TAG"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SECRET }}
        run: pnpm release

      - name: Detect published version
        id: detect
        run: bash scripts/semantic-release.sh detect "${{ steps.before.outputs.tag }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push Docker Image
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    needs: release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version tags
        id: version
        run: |
          TAG="${{ env.VERSION }}"
          FULL="${TAG#v}"
          MINOR="${FULL%.*}"
          MAJOR="${FULL%%.*}"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "Tags: latest, $TAG, $FULL, $MINOR, $MAJOR, sha-${{ github.sha }}"

      - name: Start build-time Postgres
        run: |
          docker run -d --name shayga-builddb \
            -e POSTGRES_USER=shayga \
            -e POSTGRES_PASSWORD=shayga_dev \
            -e POSTGRES_DB=shayga \
            -e PGDATA=/var/lib/postgresql/pgdata \
            -p 5432:5432 \
            --health-cmd "pg_isready -U shayga -d shayga" \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 20 \
            postgres:18-alpine
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' shayga-builddb 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && echo "Build DB healthy" && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' shayga-builddb

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          export IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          export FULL=${{ steps.version.outputs.full }}
          export MINOR=${{ steps.version.outputs.minor }}
          export MAJOR=${{ steps.version.outputs.major }}
          docker build \
            --network=host \
            --build-arg DATABASE_URL="postgres://shayga:shayga_dev@127.0.0.1:5432/shayga" \
            --build-arg NEXT_PUBLIC_GA_MEASUREMENT_ID="${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}" \
            --build-arg NEXT_PUBLIC_RAZORPAY_KEY_ID="${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg APP_VERSION="${{ env.VERSION }}" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:v$FULL" \
            --tag "$IMAGE:$FULL" \
            --tag "$IMAGE:$MINOR" \
            --tag "$IMAGE:$MAJOR" \
            --tag "$IMAGE:sha-${{ github.sha }}" \
            .
          docker push --all-tags "$IMAGE"

  deploy:
    name: Deploy to Production
    needs: [validate, build]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    runs-on: [self-hosted, production]
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Sync deploy files
        run: cp docker-compose.prod.yml Caddyfile Makefile /opt/shayga/

      - name: Deploy
        working-directory: /opt/shayga
        run: make prod-deploy IMAGE_TAG=${{ env.IMAGE_TAG }} ENV_FILE=.env.production.i-0b8fdac5ef38c22ad

      - name: Verify containers
        working-directory: /opt/shayga
        run: |
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml ps --status running --quiet app | grep -q . && echo "app running" || { echo "app not running"; exit 1; }

      - name: Prune stale Docker images
        run: |
          docker image prune -af
          docker builder prune -af
