name: Deploy Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start build-time Postgres
        run: |
          docker run -d --name shayga-builddb \
            -e POSTGRES_USER=shayga \
            -e POSTGRES_PASSWORD=shayga_dev \
            -e POSTGRES_DB=shayga \
            -e PGDATA=/var/lib/postgresql/pgdata \
            -p 5432:5432 \
            --health-cmd "pg_isready -U shayga -d shayga" \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 20 \
            postgres:18-alpine
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' shayga-builddb 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && echo "Build DB healthy" && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' shayga-builddb

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          export IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          docker build \
            --network=host \
            --build-arg DATABASE_URL="postgres://shayga:shayga_dev@127.0.0.1:5432/shayga" \
            --tag "$IMAGE:develop" \
            --tag "$IMAGE:sha-${{ github.sha }}" \
            .
          docker push "$IMAGE:develop"
          docker push "$IMAGE:sha-${{ github.sha }}"

  deploy:
    name: Deploy to Staging
    runs-on: [self-hosted, staging]
    needs: build
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-config
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write staging env
        run: printf '%s\n' "${{ secrets.STAGING_ENV }}" > .env.staging

      - name: Isolate Docker config (bypass macOS Keychain)
        run: |
          # DOCKER_CONFIG points docker at a job-local directory so that
          # `docker login` writes a plain-text config here instead of trying
          # to store the GHCR password in the macOS Keychain, which fails on
          # non-interactive CI runners with "User interaction is not allowed
          # (-25308)".
          mkdir -p "$DOCKER_CONFIG"
          echo '{"auths":{},"credsStore":""}' > "$DOCKER_CONFIG/config.json"
          echo "Docker config isolated to $DOCKER_CONFIG"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image
        run: docker compose -f docker-compose.staging.yml pull app

      - name: Start Postgres
        run: docker compose -f docker-compose.staging.yml up -d postgres

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.staging.yml exec -T postgres pg_isready -U shayga -d shayga >/dev/null 2>&1; then
              echo "postgres ready"
              exit 0
            fi
            sleep 2
          done
          echo "postgres not ready"
          exit 1

      - name: Run migrations
        run: docker compose -f docker-compose.staging.yml run --rm --no-deps app sh -c "npx payload migrate && npx better-auth migrate --config src/lib/auth.ts -y"

      - name: Start app
        run: docker compose -f docker-compose.staging.yml up -d --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:80/ || true)
            if [ "$code" != "000" ]; then
              echo "app responded ($code)"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed"
          docker compose -f docker-compose.staging.yml ps
          exit 1
