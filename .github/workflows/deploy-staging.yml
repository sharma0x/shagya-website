name: Deploy Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            NEXT_TELEMETRY_DISABLED=1

  deploy:
    name: Deploy to Staging
    runs-on: [self-hosted, staging]
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write staging env
        run: printf '%s\n' "${{ secrets.STAGING_ENV }}" > .env.staging

      - name: Configure Docker to skip keychain
        run: |
          mkdir -p ~/.docker
          echo '{"credsStore":""}' > ~/.docker/config.json

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image
        run: docker compose -f docker-compose.staging.yml pull app

      - name: Start Postgres
        run: docker compose -f docker-compose.staging.yml up -d postgres

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.staging.yml exec -T postgres pg_isready -U shayga -d shayga >/dev/null 2>&1; then
              echo "postgres ready"
              exit 0
            fi
            sleep 2
          done
          echo "postgres not ready"
          exit 1

      - name: Run migrations
        run: docker compose -f docker-compose.staging.yml run --rm --no-deps app sh -c "npx payload migrate && npx better-auth migrate --config src/lib/auth.ts -y"

      - name: Start app
        run: docker compose -f docker-compose.staging.yml up -d --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:80/ || true)
            if [ "$code" != "000" ]; then
              echo "app responded ($code)"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed"
          docker compose -f docker-compose.staging.yml ps
          exit 1
