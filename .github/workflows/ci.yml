name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: ci-secret-placeholder-32-chars-minimum-length
      BETTER_AUTH_SECRET: ci-secret-placeholder-32-chars-minimum-length
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      NEXT_PUBLIC_FB_PIXEL_ID: ${{ vars.NEXT_PUBLIC_FB_PIXEL_ID }}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      DATABASE_URL: postgres://shayga:shayga_dev@localhost:5432/shayga
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shayga
          POSTGRES_PASSWORD: shayga_dev
          POSTGRES_DB: shayga
          PGDATA: /var/lib/postgresql/pgdata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shayga -d shayga"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        volumes:
          - /var/lib/postgresql
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.1.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & Component tests
        run: pnpm test

      - name: Apply database migrations
        run: |
          pnpm exec better-auth migrate --config src/lib/auth.ts -y
          pnpm exec payload migrate

      - name: Build Next.js & Payload
        run: pnpm build
