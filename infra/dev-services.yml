# =============================================================================
# Shayga — Local Development Services
# =============================================================================
# Start: docker compose -f infra/dev-services.yml up -d
# Stop:  docker compose -f infra/dev-services.yml down
# Reset: docker compose -f infra/dev-services.yml down -v
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 18 — matches Neon production
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: shayga-pg
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: shayga
      POSTGRES_PASSWORD: shayga_dev
      POSTGRES_DB: shayga
      PGDATA: /var/lib/postgresql/pgdata
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shayga -d shayga']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ---------------------------------------------------------------------------
  # Object storage (local replacement for Cloudflare R2)
  # ---------------------------------------------------------------------------
  # API:          http://localhost:9000  (S3 endpoint)
  # Console:      http://localhost:9001  (web UI — login with minioadmin/minioadmin)
  # Bucket:       shayga-media
  #
  # Was MinIO until Sept 2026. MinIO's community edition is source-only now: the
  # Docker Hub `minio/minio` and `minio/mc` repos were deleted outright and
  # quay.io rejects anonymous pulls, so the old image cannot be fetched at all
  # and `make infra-up` fails. RustFS is a maintained, S3-API-compatible
  # drop-in that is still published. The app needs no change — Payload reaches
  # storage purely through the R2_* vars in .env, not via the image name.
  # ===========================================================================
  minio:
    image: rustfs/rustfs:latest
    container_name: shayga-minio
    restart: unless-stopped
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web console
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_ROOT_USER: minioadmin
      RUSTFS_ROOT_PASSWORD: minioadmin
    command: /data
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ---------------------------------------------------------------------------
  # The shayga-media bucket creator was a minio/mc sidecar. minio/mc no longer
  # exists on Docker Hub. RustFS does NOT auto-create buckets on first write
  # (verified — writes fail with NoSuchBucket), so the bucket must be created
  # once against the S3 API before seeding. See docs/local-storage.md.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Mailpit — SMTP test server (local replacement for Resend)
  # ---------------------------------------------------------------------------
  # SMTP:   http://localhost:1025
  # Web UI: http://localhost:8025
  # API:    http://localhost:8025/api/v1
  # ===========================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: shayga-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ---------------------------------------------------------------------------
  # Adminer — Database management UI (lightweight phpMyAdmin alternative)
  # ---------------------------------------------------------------------------
  # URL: http://localhost:8080
  # Connect to: postgres (hostname), shayga (database), shayga (user), shayga_dev (password)
  # System: PostgreSQL
  # ===========================================================================
  adminer:
    image: adminer:latest
    container_name: shayga-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  pgdata:
    name: shayga-pgdata
  miniodata:
    name: shayga-miniodata
