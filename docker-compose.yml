services:
  app:
    build: .
    container_name: shayga-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://shayga:shayga_dev@postgres:5432/shayga
      - R2_ENDPOINT=http://minio:9000
      - MAILPIT_SMTP_HOST=mailpit
      - MAILPIT_SMTP_PORT=1025
      - MAILPIT_API_URL=http://mailpit:8025/api/v1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  postgres:
    image: postgres:18-alpine
    container_name: shayga-pg
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: shayga
      POSTGRES_PASSWORD: shayga_dev
      POSTGRES_DB: shayga
      PGDATA: /var/lib/postgresql/pgdata
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shayga -d shayga']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  minio:
    image: minio/minio:latest
    container_name: shayga-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  minio-create-bucket:
    image: minio/mc:latest
    container_name: shayga-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb local/shayga-media --ignore-existing;
      echo 'MinIO bucket shayga-media ready';
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: shayga-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  adminer:
    image: adminer:latest
    container_name: shayga-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  pgdata:
    name: shayga-prod-pgdata
  miniodata:
    name: shayga-prod-miniodata
